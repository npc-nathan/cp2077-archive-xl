name: build-archivexl

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest

      - name: Configure (release, x64)
        run: xmake f -a x64 -m release -y

      - name: Build
        run: xmake -y

      - name: List build output
        shell: pwsh
        run: Get-ChildItem -Recurse build | Select-Object -First 40 FullName, Length | Format-Table -AutoSize

      - uses: actions/upload-artifact@v4
        with:
          name: ArchiveXL-dll
          path: build/windows/x64/release/ArchiveXL.dll
          if-no-files-found: error
